[package]
name = "qwen-sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qwen-sandbox"
path = "src/main.rs"

[dependencies]
ratatui          = "0.28"
crossterm        = "0.28"
tokio            = { version = "1", features = ["full"] }
reqwest          = { version = "0.12", features = ["json"] }
serde            = { version = "1",   features = ["derive"] }
serde_json       = "1"
anyhow           = "1"
futures = "0.3.32"
